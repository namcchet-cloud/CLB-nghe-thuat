<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chaos Typography Generator</title>
<style>
  :root{
    --panel: rgba(18,18,22,.94);
    --border: rgba(255,255,255,.14);
    --text: #f3f3f3;
    --muted: #a7a7ad;
    --accent: #e7ff5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00ff00;font-family:Arial,sans-serif}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #panel{
    position:fixed;left:18px;top:18px;z-index:20;
    width:min(420px,calc(100vw - 36px));color:var(--text);
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:14px;backdrop-filter:blur(12px);
    box-shadow:0 18px 45px rgba(0,0,0,.28)
  }
  #panel h1{font-size:16px;margin:0 0 10px}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:9px 0}
  .row.stack{grid-template-columns:1fr}
  label{font-size:12px;color:var(--muted)}
  input[type=text],select{
    width:100%;border:1px solid var(--border);border-radius:10px;
    padding:10px 11px;background:#111217;color:#fff;font-size:14px
  }
  input[type=range]{width:190px}
  input[type=color]{width:44px;height:30px;border:0;background:transparent;padding:0}
  .value{font-size:12px;min-width:62px;text-align:right;color:#fff}
  .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  button{
    border:1px solid var(--border);border-radius:10px;padding:9px 10px;
    background:#22242b;color:#fff;font-weight:700;cursor:pointer
  }
  button:hover{background:#2d3038}
  button.primary{background:var(--accent);color:#111;border-color:transparent}
  button.danger{background:#ff5f66;color:#111;border-color:transparent}
  #hint{font-size:11px;line-height:1.45;color:var(--muted);margin-top:10px}
  #mini{
    position:fixed;right:16px;bottom:16px;z-index:21;display:none;
    background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer
  }
  .kbd{padding:1px 5px;border:1px solid #555;border-radius:5px;color:#ddd}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="panel">
  <h1>CHAOS TYPE — newspaper / magazine / poster</h1>

  <div class="row stack">
    <label for="text">Nội dung</label>
    <input id="text" type="text" value="ART CLUB" maxlength="80" />
  </div>

  <div class="row stack">
    <label for="theme">Phong cách tổng</label>
    <select id="theme">
      <option value="mixed">MIXED — trộn tất cả</option>
      <option value="newspaper">Newspaper / báo cắt</option>
      <option value="magazine">Magazine Pop</option>
      <option value="retro">Retro 70s–90s</option>
      <option value="comic">Comic / Pop Art</option>
      <option value="punk">Punk / Zine</option>
      <option value="marker">Marker / Handwritten</option>
      <option value="luxury">Editorial / Luxury</option>
      <option value="digital">Digital / Glitch</option>
    </select>
  </div>

  <div class="row">
    <label>Tốc độ đổi style</label>
    <div>
      <input id="speed" type="range" min="35" max="500" step="5" value="85">
      <span class="value" id="speedVal">85 ms</span>
    </div>
  </div>

  <div class="row">
    <label>Cỡ chữ</label>
    <div>
      <input id="size" type="range" min="40" max="260" step="2" value="126">
      <span class="value" id="sizeVal">126 px</span>
    </div>
  </div>

  <div class="row">
    <label>Độ hỗn loạn</label>
    <div>
      <input id="chaos" type="range" min="0" max="100" step="1" value="68">
      <span class="value" id="chaosVal">68%</span>
    </div>
  </div>

  <div class="row">
    <label>Độ nhiều màu</label>
    <div>
      <input id="colorfulness" type="range" min="0" max="100" step="1" value="85">
      <span class="value" id="colorfulnessVal">85%</span>
    </div>
  </div>

  <div class="row">
    <label>Khoảng chữ</label>
    <div>
      <input id="spacing" type="range" min="-20" max="45" step="1" value="4">
      <span class="value" id="spacingVal">4 px</span>
    </div>
  </div>

  <div class="row">
    <label>Nền chroma</label>
    <input id="bg" type="color" value="#00ff00">
  </div>

  <div class="btns">
    <button class="primary" id="toggle">❚❚ Freeze</button>
    <button id="shuffle">↻ Shuffle</button>
    <button id="hide">◫ Ẩn bảng</button>
    <button id="full">⛶ Toàn màn hình</button>
  </div>

  <div id="hint">
    Bản này có thêm nhiều kiểu chữ, giấy màu, chữ màu, outline, bóng đổ, capsule, stamp, comic, glitch...<br>
    Phím: <span class="kbd">Space</span> Freeze/Play ·
    <span class="kbd">S</span> Shuffle ·
    <span class="kbd">H</span> Ẩn/hiện bảng.
  </div>
</div>
<button id="mini">Hiện điều khiển (H)</button>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: true });

  const ui = {
    text: document.getElementById('text'),
    theme: document.getElementById('theme'),
    speed: document.getElementById('speed'),
    speedVal: document.getElementById('speedVal'),
    size: document.getElementById('size'),
    sizeVal: document.getElementById('sizeVal'),
    chaos: document.getElementById('chaos'),
    chaosVal: document.getElementById('chaosVal'),
    colorfulness: document.getElementById('colorfulness'),
    colorfulnessVal: document.getElementById('colorfulnessVal'),
    spacing: document.getElementById('spacing'),
    spacingVal: document.getElementById('spacingVal'),
    bg: document.getElementById('bg'),
    toggle: document.getElementById('toggle'),
    shuffle: document.getElementById('shuffle'),
    hide: document.getElementById('hide'),
    full: document.getElementById('full'),
    panel: document.getElementById('panel'),
    mini: document.getElementById('mini')
  };

  const fontGroups = {
    newspaper: ['Times New Roman','Georgia','Courier New','Arial Black','Book Antiqua','Palatino Linotype'],
    magazine: ['Arial Black','Trebuchet MS','Verdana','Georgia','Gill Sans','Impact'],
    retro: ['Cooper Black','Georgia','Trebuchet MS','Arial Black','Book Antiqua','Impact'],
    comic: ['Comic Sans MS','Impact','Arial Black','Trebuchet MS','Verdana'],
    punk: ['Impact','Courier New','Arial Black','Times New Roman','Lucida Console'],
    marker: ['Comic Sans MS','Segoe Print','Bradley Hand','Trebuchet MS','Arial'],
    luxury: ['Didot','Bodoni MT','Georgia','Times New Roman','Palatino Linotype'],
    digital: ['Lucida Console','Courier New','Arial Black','Verdana','Tahoma']
  };
  const allFonts = [...new Set(Object.values(fontGroups).flat())];

  const palettes = [
    ['#ff3b30','#ffcc00','#007aff','#34c759','#af52de','#ff2d55'],
    ['#f72585','#b5179e','#7209b7','#4361ee','#4cc9f0','#ffd166'],
    ['#ff6b35','#f7c59f','#2a9d8f','#264653','#e9c46a','#e76f51'],
    ['#111111','#f94144','#f3722c','#f8961e','#90be6d','#577590'],
    ['#ff006e','#8338ec','#3a86ff','#fb5607','#ffbe0b','#00b4d8'],
    ['#c1121f','#780000','#fdf0d5','#003049','#669bbc','#f4a261'],
    ['#22223b','#4a4e69','#9a8c98','#c9ada7','#f2e9e4','#000000'],
    ['#00f5d4','#00bbf9','#fee440','#f15bb5','#9b5de5','#ff4d6d']
  ];

  const neutralPapers = ['#f5efe1','#fffdf3','#e4ded2','#d6d0c4','#ffffff','#dedede','#cfc7b5'];
  const coloredPapers = ['#ffef9f','#ffd6e0','#cdeffd','#d8f3dc','#e7c6ff','#ffd8be','#caffbf','#fdffb6','#bde0fe','#ffc6ff','#f8edeb','#f1c0e8'];

  let dpr = 1;
  let playing = true;
  let styles = [];
  let lastChange = 0;

  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    render();
  }

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function chance(p){ return Math.random() < p; }

  function getTheme(){
    const selected = ui.theme.value;
    if(selected !== 'mixed') return selected;
    return pick(['newspaper','magazine','retro','comic','punk','marker','luxury','digital']);
  }

  function makeStyle(ch){
    const chaos = Number(ui.chaos.value) / 100;
    const colorfulness = Number(ui.colorfulness.value) / 100;
    const theme = getTheme();
    const palette = pick(palettes);

    const fontPool = ui.theme.value === 'mixed' ? allFonts : (fontGroups[theme] || allFonts);

    let paperPool = neutralPapers;
    if(chance(colorfulness)) paperPool = [...neutralPapers, ...coloredPapers];

    let ink = '#111111';
    if(chance(colorfulness * .88)) ink = pick(palette);

    const effects = {
      newspaper: {rot:8, scale:.18, outline:.10, shadow:.25, capsule:.05, stamp:.15, invert:.08, slash:.08},
      magazine:  {rot:6, scale:.23, outline:.30, shadow:.45, capsule:.25, stamp:.05, invert:.15, slash:.10},
      retro:     {rot:7, scale:.25, outline:.35, shadow:.55, capsule:.18, stamp:.08, invert:.18, slash:.08},
      comic:     {rot:10,scale:.20, outline:.55, shadow:.55, capsule:.28, stamp:.10, invert:.16, slash:.18},
      punk:      {rot:14,scale:.25, outline:.40, shadow:.38, capsule:.10, stamp:.32, invert:.26, slash:.24},
      marker:    {rot:8, scale:.14, outline:.10, shadow:.12, capsule:.05, stamp:.08, invert:.05, slash:.16},
      luxury:    {rot:3, scale:.12, outline:.08, shadow:.18, capsule:.02, stamp:.03, invert:.05, slash:.03},
      digital:   {rot:5, scale:.16, outline:.40, shadow:.45, capsule:.18, stamp:.08, invert:.22, slash:.18}
    }[theme];

    return {
      theme,
      font: pick(fontPool),
      weight: pick([400,500,600,700,800,900]),
      italic: chance(theme === 'luxury' ? .34 : .20),
      scale: rand(1 - effects.scale*chaos*.7, 1 + effects.scale*chaos),
      rot: rand(-effects.rot,effects.rot) * chaos,
      dx: rand(-6,6) * chaos,
      dy: rand(-9,9) * chaos,
      paper: pick(paperPool),
      ink,
      border: chance(.34),
      shadow: chance(effects.shadow),
      outline: chance(effects.outline),
      capsule: chance(effects.capsule),
      stamp: chance(effects.stamp),
      invert: chance(effects.invert),
      slash: chance(effects.slash),
      underline: chance(.14),
      uppercase: chance(.08) && /[a-zà-ỹ]/i.test(ch),
      pattern: chance(.18),
      glitch: theme === 'digital' && chance(.30),
      double: (theme === 'retro' || theme === 'comic') && chance(.18),
      paperSkew: rand(-0.06,0.06) * chaos
    };
  }

  function reshuffle(){
    const text = ui.text.value || ' ';
    styles = Array.from(text, ch => makeStyle(ch));
    render();
  }

  function measureLayout(text, baseSize){
    ctx.font = `700 ${baseSize}px Arial`;
    const widths = Array.from(text, ch => {
      if(ch === ' ') return baseSize * .34;
      return Math.max(baseSize*.34, ctx.measureText(ch).width);
    });
    const spacing = Number(ui.spacing.value);
    const total = widths.reduce((a,b)=>a+b,0) + Math.max(0,text.length-1)*spacing;
    return { widths, total, spacing };
  }

  function drawShape(cx,cy,w,h,s,angle){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);
    ctx.transform(1,s.paperSkew,0,1,0,0);

    let paper = s.paper;
    let ink = s.ink;
    if(s.invert){ const tmp = paper; paper = ink; ink = tmp; }
    s._drawInk = ink;

    ctx.fillStyle = paper;
    ctx.shadowColor = s.shadow ? 'rgba(0,0,0,.30)' : 'transparent';
    ctx.shadowBlur = s.shadow ? 9 : 0;
    ctx.shadowOffsetX = s.shadow ? 3 : 0;
    ctx.shadowOffsetY = s.shadow ? 4 : 0;

    const r = s.capsule ? h*.35 : 2;
    const x=-w/2,y=-h/2;
    if(s.capsule){
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,r);
      ctx.fill();
    } else {
      const j=3.2;
      ctx.beginPath();
      ctx.moveTo(x+rand(-j,j),y+rand(-j,j));
      ctx.lineTo(x+w+rand(-j,j),y+rand(-j,j));
      ctx.lineTo(x+w+rand(-j,j),y+h+rand(-j,j));
      ctx.lineTo(x+rand(-j,j),y+h+rand(-j,j));
      ctx.closePath();
      ctx.fill();
    }

    if(s.pattern){
      ctx.globalAlpha=.12;
      ctx.strokeStyle='#000';
      ctx.lineWidth=1;
      for(let i=-w;i<w;i+=10){
        ctx.beginPath();ctx.moveTo(i,-h/2);ctx.lineTo(i+h,h/2);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    if(s.border){
      ctx.strokeStyle='rgba(0,0,0,.26)';
      ctx.lineWidth=s.stamp?3:1;
      ctx.strokeRect(-w/2,-h/2,w,h);
    }
    ctx.restore();
  }

  function drawLetter(ch,cx,cy,slotW,baseSize,s){
    const drawSize=baseSize*s.scale;
    const angle=s.rot*Math.PI/180;

    ctx.save();
    ctx.font=`${s.italic?'italic ':''}${s.weight} ${drawSize}px "${s.font}"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    const drawCh=s.uppercase?ch.toUpperCase():ch;
    const m=ctx.measureText(drawCh);
    const pw=Math.max(slotW*.82,m.width+drawSize*.22);
    const ph=drawSize*1.08;

    drawShape(cx,cy,pw,ph,s,angle);

    ctx.translate(cx,cy);
    ctx.rotate(angle);
    ctx.transform(1,s.paperSkew,0,1,0,0);

    if(s.double){
      ctx.fillStyle='rgba(0,0,0,.18)';
      ctx.fillText(drawCh,drawSize*.06,drawSize*.07);
    }

    if(s.glitch){
      ctx.save();
      ctx.globalAlpha=.55;
      ctx.fillStyle='#00e5ff';
      ctx.fillText(drawCh,-drawSize*.035,0);
      ctx.fillStyle='#ff2e88';
      ctx.fillText(drawCh,drawSize*.035,0);
      ctx.restore();
    }

    if(s.outline){
      ctx.lineWidth=Math.max(2,drawSize*.045);
      ctx.strokeStyle=s._drawInk || s.ink;
      ctx.strokeText(drawCh,0,drawSize*.02);
      ctx.fillStyle='#ffffff';
      if(s.invert) ctx.fillStyle='#111111';
      ctx.fillText(drawCh,0,drawSize*.02);
    } else {
      ctx.fillStyle=s._drawInk || s.ink;
      ctx.fillText(drawCh,0,drawSize*.02);
    }

    if(s.stamp){
      ctx.globalAlpha=.18;
      ctx.fillStyle='#000';
      for(let k=0;k<18;k++){
        const rx=rand(-pw*.42,pw*.42), ry=rand(-ph*.3,ph*.3);
        ctx.fillRect(rx,ry,rand(1,4),rand(1,3));
      }
      ctx.globalAlpha=1;
    }

    if(s.underline){
      ctx.strokeStyle=s._drawInk || s.ink;
      ctx.lineWidth=Math.max(1,drawSize*.025);
      ctx.beginPath();
      ctx.moveTo(-pw*.36,drawSize*.36);
      ctx.lineTo(pw*.36,drawSize*.36);
      ctx.stroke();
    }

    if(s.slash){
      ctx.globalAlpha=.55;
      ctx.strokeStyle=s._drawInk || s.ink;
      ctx.lineWidth=Math.max(2,drawSize*.025);
      ctx.beginPath();
      ctx.moveTo(-pw*.42,rand(-ph*.2,ph*.2));
      ctx.lineTo(pw*.42,rand(-ph*.2,ph*.2));
      ctx.stroke();
      ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  function render(){
    const W=innerWidth,H=innerHeight;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=ui.bg.value;
    ctx.fillRect(0,0,W,H);

    const text=ui.text.value || 'ART CLUB';
    const baseSize=Number(ui.size.value);
    if(styles.length!==Array.from(text).length) styles=Array.from(text,ch=>makeStyle(ch));

    const layout=measureLayout(text,baseSize);
    let x=(W-layout.total)/2;
    const y=H/2;

    Array.from(text).forEach((ch,i)=>{
      const slotW=layout.widths[i];
      if(ch===' '){x+=slotW+layout.spacing;return;}
      const s=styles[i]||makeStyle(ch);
      drawLetter(ch,x+slotW/2+s.dx,y+s.dy,slotW,baseSize,s);
      x+=slotW+layout.spacing;
    });
  }

  function updateLabels(){
    ui.speedVal.textContent=ui.speed.value+' ms';
    ui.sizeVal.textContent=ui.size.value+' px';
    ui.chaosVal.textContent=ui.chaos.value+'%';
    ui.colorfulnessVal.textContent=ui.colorfulness.value+'%';
    ui.spacingVal.textContent=ui.spacing.value+' px';
  }

  function togglePlay(){
    playing=!playing;
    ui.toggle.textContent=playing?'❚❚ Freeze':'▶ Play';
    ui.toggle.classList.toggle('danger',!playing);
    ui.toggle.classList.toggle('primary',playing);
    if(playing) lastChange=0;
  }

  function setPanelHidden(hidden){
    ui.panel.style.display=hidden?'none':'block';
    ui.mini.style.display=hidden?'block':'none';
  }

  function animate(t){
    if(playing && (t-lastChange>=Number(ui.speed.value))){
      reshuffle();
      lastChange=t;
    }
    requestAnimationFrame(animate);
  }

  ['input','change'].forEach(evt=>{
    ui.text.addEventListener(evt,reshuffle);
    ui.theme.addEventListener(evt,reshuffle);
    ui.speed.addEventListener(evt,updateLabels);
    ui.size.addEventListener(evt,()=>{updateLabels();render();});
    ui.chaos.addEventListener(evt,()=>{updateLabels();reshuffle();});
    ui.colorfulness.addEventListener(evt,()=>{updateLabels();reshuffle();});
    ui.spacing.addEventListener(evt,()=>{updateLabels();render();});
    ui.bg.addEventListener(evt,render);
  });

  ui.toggle.onclick=togglePlay;
  ui.shuffle.onclick=reshuffle;
  ui.hide.onclick=()=>setPanelHidden(true);
  ui.mini.onclick=()=>setPanelHidden(false);
  ui.full.onclick=async()=>{
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){}
  };

  addEventListener('keydown',e=>{
    if(e.target && e.target.tagName==='INPUT') return;
    if(e.code==='Space'){e.preventDefault();togglePlay();}
    if(e.key.toLowerCase()==='s') reshuffle();
    if(e.key.toLowerCase()==='h') setPanelHidden(ui.panel.style.display!=='none');
  });

  addEventListener('resize',resize);

  updateLabels();
  resize();
  reshuffle();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
